name: Deploy M4 and recruitment experience lab
on:
  push:
    branches: [main]
    paths: [m4.part-*.b64, recruitment-20261027-1.part-*.b64, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Publish M4')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unpack the verified static release
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, pathlib, zipfile
          root = pathlib.Path('_site/releases/m4-20261027-1')
          parts = sorted(pathlib.Path('.').glob('m4.part-*.b64'))
          data = base64.b64decode(b''.join(p.read_bytes() for p in parts))
          if hashlib.sha256(data).hexdigest() != 'c9a513437a218f465763511529ab937df255da2007a373d5391335300edf66d7':
              raise ValueError('Release archive checksum mismatch')
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              if any(pathlib.PurePosixPath(n).is_absolute() or '..' in pathlib.PurePosixPath(n).parts for n in archive.namelist()):
                  raise ValueError('Unsafe archive path')
              archive.extractall(root)
          manifest = json.loads((root / 'BUILD_MANIFEST.json').read_text())
          for name, expected in manifest.items():
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if actual != expected:
                  raise ValueError('Checksum mismatch: ' + name)
          print('Verified', len(manifest), 'static files')
          destination = pathlib.Path('_site')
          (destination / '.nojekyll').write_text('')
          redirect = '<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北宋商旅人生 M4</title><a href="releases/RELEASE_ID/">開啟 M4 測試版</a><script>location.replace("releases/RELEASE_ID/"+location.search+location.hash)</script></html>'
          (destination / 'index.html').write_text(redirect.replace('RELEASE_ID','m4-20261027-1'))
          for old_release in ['m2-20261026-1','m3-20261027-1']:
              previous = destination / 'releases' / old_release
              previous.mkdir(parents=True, exist_ok=True)
              (previous / 'index.html').write_text(redirect.replace('releases/RELEASE_ID/','../RELEASE_ID/').replace('RELEASE_ID','m4-20261027-1'))

          lab_data = base64.b64decode(b''.join(p.read_bytes() for p in sorted(pathlib.Path('.').glob('recruitment-20261027-1.part-*.b64'))))
          if hashlib.sha256(lab_data).hexdigest() != 'bcb82925d1e66d0ace46561216075c474e58cb5d43102c03d715ce8e474bbf5b':
              raise ValueError('Recruitment lab checksum mismatch')
          lab = destination / 'labs/recruitment'
          with zipfile.ZipFile(io.BytesIO(lab_data)) as archive:
              if any(pathlib.PurePosixPath(n).is_absolute() or '..' in pathlib.PurePosixPath(n).parts for n in archive.namelist()):
                  raise ValueError('Unsafe lab archive path')
              archive.extractall(lab)
          lab_manifest = json.loads((lab / 'BUILD_MANIFEST.json').read_text())
          for name, expected in lab_manifest.items():
              if hashlib.sha256((lab / name).read_bytes()).hexdigest() != expected:
                  raise ValueError('Lab file checksum mismatch: ' + name)
          print('Verified', len(lab_manifest), 'recruitment lab files; M4 runtime preserved')

          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
