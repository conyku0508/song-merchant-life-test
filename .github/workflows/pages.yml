name: Deploy 天下豪商 preview
on:
  push:
    branches: [main]
    paths: [m4.part-*.b64, branding-20261027-1.part-*.b64, integration-20261027-1.part-*.b64, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Publish M4')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unpack the verified static release
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, pathlib, zipfile
          root = pathlib.Path('_site/releases/m4-20261027-1')
          parts = sorted(pathlib.Path('.').glob('m4.part-*.b64'))
          data = base64.b64decode(b''.join(p.read_bytes() for p in parts))
          if hashlib.sha256(data).hexdigest() != 'c9a513437a218f465763511529ab937df255da2007a373d5391335300edf66d7':
              raise ValueError('Release archive checksum mismatch')
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              if any(pathlib.PurePosixPath(n).is_absolute() or '..' in pathlib.PurePosixPath(n).parts for n in archive.namelist()):
                  raise ValueError('Unsafe archive path')
              archive.extractall(root)
          manifest = json.loads((root / 'BUILD_MANIFEST.json').read_text())
          for name, expected in manifest.items():
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if actual != expected:
                  raise ValueError('Checksum mismatch: ' + name)
          print('Verified', len(manifest), 'static files')
          import shutil
          branding_data = base64.b64decode(b''.join(p.read_bytes() for p in sorted(pathlib.Path('.').glob('branding-20261027-1.part-*.b64'))))
          if hashlib.sha256(branding_data).hexdigest() != '65529f08c9f285960ac8bbfbcb26148d45e055668e1c2f5b3c5d5f211496d4f7':
              raise ValueError('Branding archive checksum mismatch')
          destination = pathlib.Path('_site')
          branded = destination / 'releases/m4-20261027-2'
          lab = destination / 'labs/recruitment-20261027-4'
          shutil.copytree(root, branded)
          with zipfile.ZipFile(io.BytesIO(branding_data)) as archive:
              names = archive.namelist()
              if any(pathlib.PurePosixPath(n).is_absolute() or '..' in pathlib.PurePosixPath(n).parts for n in names):
                  raise ValueError('Unsafe branding archive path')
              patch = json.loads(archive.read('MANIFEST.json'))
              for name, expected in patch['files'].items():
                  data = archive.read(name)
                  if hashlib.sha256(data).hexdigest() != expected:
                      raise ValueError('Brand file mismatch: ' + name)
                  category, relative = name.split('/', 1)
                  if category not in ['main','lab']:
                      raise ValueError('Unexpected brand file category')
                  target = (branded if category == 'main' else lab) / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
          expected_main = dict(manifest)
          for name, expected in patch['files'].items():
              if name.startswith('main/'):
                  expected_main[name[5:]] = expected
          for name, expected in expected_main.items():
              if hashlib.sha256((branded / name).read_bytes()).hexdigest() != expected:
                  raise ValueError('Branded runtime mismatch: ' + name)
          (branded / 'BUILD_MANIFEST.json').write_text(json.dumps(expected_main, indent=2))
          release = json.loads((branded / 'release.json').read_text())
          release.update(gameTitle='天下豪商', release='m4-20261027-2', brandingOnly=True)
          (branded / 'release.json').write_text(json.dumps(release, ensure_ascii=False, indent=2))
          lab_manifest = {name[4:]:sha for name,sha in patch['files'].items() if name.startswith('lab/')}
          (lab / 'BUILD_MANIFEST.json').write_text(json.dumps(lab_manifest, indent=2))
          (lab / 'release.json').write_text(json.dumps({'release':'recruitment-20261027-4','gameTitle':'天下豪商','connectedToM4World':False},ensure_ascii=False,indent=2))
          def redirect(target):
              return '<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天下豪商</title><a href="'+target+'">開啟天下豪商</a><script>location.replace("'+target+'"+location.search+location.hash)</script></html>'
          (destination / '.nojekyll').write_text('')
          (destination / 'index.html').write_text(redirect('releases/m4-20261027-2/'))
          for old in ['m2-20261026-1','m3-20261027-1','m4-20261027-1']:
              alias = destination / 'releases' / old
              alias.mkdir(parents=True, exist_ok=True)
              (alias / 'index.html').write_text(redirect('../m4-20261027-2/'))
          old_manifest = dict(manifest)
          old_manifest['index.html'] = hashlib.sha256((root / 'index.html').read_bytes()).hexdigest()
          (root / 'BUILD_MANIFEST.json').write_text(json.dumps(old_manifest, indent=2))
          for old in ['recruitment','recruitment-20261027-3']:
              alias = destination / 'labs' / old
              alias.mkdir(parents=True, exist_ok=True)
              (alias / 'index.html').write_text(redirect('../recruitment-20261027-4/'))
          integration_data = base64.b64decode(b''.join(p.read_bytes() for p in sorted(pathlib.Path('.').glob('integration-20261027-1.part-*.b64'))))
          if hashlib.sha256(integration_data).hexdigest() != 'b524ce0d026604ed13267834d26726bcf68148a5c4199f83b7463618d957cc2e':
              raise ValueError('Integration archive checksum mismatch')
          integrated = destination / 'releases/m4-20261027-3'
          shutil.copytree(branded, integrated)
          with zipfile.ZipFile(io.BytesIO(integration_data)) as archive:
              if any(pathlib.PurePosixPath(n).is_absolute() or '..' in pathlib.PurePosixPath(n).parts for n in archive.namelist()):
                  raise ValueError('Unsafe integration archive path')
              integrated_patch = json.loads(archive.read('MANIFEST.json'))
              for name, expected in integrated_patch['files'].items():
                  content = archive.read(name)
                  if hashlib.sha256(content).hexdigest() != expected:
                      raise ValueError('Integration mismatch: '+name)
                  target = integrated / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(content)
          integrated_manifest = json.loads((integrated / 'BUILD_MANIFEST.json').read_text())
          for name, expected in integrated_manifest.items():
              if hashlib.sha256((integrated / name).read_bytes()).hexdigest() != expected:
                  raise ValueError('Integrated runtime mismatch: '+name)
          (destination / 'index.html').write_text(redirect('releases/m4-20261027-3/'))
          for old in ['m2-20261026-1','m3-20261027-1','m4-20261027-1','m4-20261027-2']:
              alias = destination / 'releases' / old
              alias.mkdir(parents=True, exist_ok=True)
              (alias / 'index.html').write_text(redirect('../m4-20261027-3/'))
              old_manifest_file = alias / 'BUILD_MANIFEST.json'
              if old_manifest_file.exists():
                  old_manifest_data = json.loads(old_manifest_file.read_text())
                  old_manifest_data['index.html'] = hashlib.sha256((alias / 'index.html').read_bytes()).hexdigest()
                  old_manifest_file.write_text(json.dumps(old_manifest_data, indent=2))
          print('Verified integrated runtime files:',len(integrated_manifest),'save v4; original M4 archive retained')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
